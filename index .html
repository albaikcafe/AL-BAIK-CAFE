<style>
  :root{
    --radius: 14px;
  }
  html[data-theme="dark"]{
    --bg: #14100c;
    --surface: #1e1812;
    --surface-2: #291f16;
    --border: #3a2c1c;
    --text: #f2e9dd;
    --text-dim: #b6a48c;
    --accent: #e08a2c;
    --accent-2: #c96a1f;
    --accent-text: #1a1206;
    --good: #6fbf73;
    --bad: #e0603f;
    --info: #4fa3d1;
    --shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  html[data-theme="light"]{
    --bg: #faf4ea;
    --surface: #ffffff;
    --surface-2: #f2e6d2;
    --border: #e3d3b8;
    --text: #2b2114;
    --text-dim: #7a6a53;
    --accent: #c96a1f;
    --accent-2: #a8551a;
    --accent-text: #fffaf2;
    --good: #2f8f3a;
    --bad: #c1432b;
    --info: #2f79a8;
    --shadow: 0 2px 10px rgba(90,60,20,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 70px;
    min-height:100vh;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--border);
    padding: 12px 14px 8px;
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .brand{ font-size:19px; font-weight:800; letter-spacing:.2px; }
  .brand span{ color:var(--accent); }
  .theme-toggle{
    display:flex; align-items:center; gap:6px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:999px; padding:5px 10px; font-size:13px; cursor:pointer;
    color:var(--text);
  }
  nav.tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim);
    padding:8px 12px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap; cursor:pointer;
  }
  .tab-btn.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  main{ padding:14px; max-width:520px; margin:0 auto; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    padding:14px; margin-bottom:12px; box-shadow: var(--shadow);
  }
  .card h2{ margin:0 0 10px; font-size:15px; color:var(--text-dim); font-weight:700; }
  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .stat{ background:var(--surface-2); border-radius:12px; padding:12px; }
  .stat .label{ font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  .stat .value{ font-size:20px; font-weight:800; }
  .stat.wide{ grid-column: 1 / -1; }
  .qty-list{ display:flex; flex-direction:column; gap:10px; }
  .qty-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border-radius:12px; padding:10px 12px;
  }
  .qty-name{ font-weight:800; font-size:20px; }
  .qty-price{ font-size:14px; color:var(--text-dim); }
  .qty-ctrl{ display:flex; align-items:center; gap:10px; }
  .qty-ctrl button{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); font-size:18px; font-weight:700; cursor:pointer;
  }
  .qty-ctrl button.plus{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .qty-num{ min-width:24px; text-align:center; font-weight:700; font-size:15px; }
  .group-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border-radius:12px; padding:12px; cursor:pointer;
    border:1px dashed var(--border);
  }
  .group-row .qty-name{ display:flex; align-items:center; gap:8px; }
  .group-badge{ background:var(--accent); color:var(--accent-text); font-size:12px; font-weight:800; border-radius:999px; padding:2px 9px; }
  .group-arrow{ font-size:13px; color:var(--text-dim); }
  .group-sub{ margin-left:10px; padding-left:10px; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:10px; }
  .bill-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--border);
    padding:10px 14px 14px; box-shadow: 0 -6px 16px rgba(0,0,0,.15);
  }
  .bill-bar.hidden{ display:none; }
  .bill-row{ display:flex; justify-content:space-between; align-items:center; max-width:520px; margin:0 auto; }
  .bill-total{ font-size:22px; font-weight:800; }
  .bill-total small{ display:block; font-size:11px; color:var(--text-dim); font-weight:500; }
  .btn{
    border:none; border-radius:12px; padding:11px 16px; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-text); }
  .btn-outline{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn-full{ width:100%; }
  .btn-good{ background:var(--good); color:#08240a; }
  .btn-bad{ background:var(--bad); color:#2a0805; }
  input, select{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:14px; margin-top:4px;
  }
  label{ font-size:12.5px; color:var(--text-dim); font-weight:600; }
  .field{ margin-bottom:10px; }
  .pay-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin:10px 0; }
  .pay-btn{
    padding:9px 4px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--text-dim); font-size:12.5px; font-weight:700; text-align:center; cursor:pointer;
  }
  .pay-btn.active{ background:var(--info); color:#fff; border-color:var(--info); }
  .expense-cat{ font-size:13px; font-weight:800; color:var(--accent); margin: 14px 0 8px; }
  .expense-cat:first-child{ margin-top:0; }
  .mini-btn-row{ display:flex; gap:8px; }
  .list-item{
    display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border);
    font-size:13.5px;
  }
  .list-item:last-child{ border-bottom:none; }
  .list-item .sub{ font-size:11.5px; color:var(--text-dim); }
  .empty{ text-align:center; color:var(--text-dim); font-size:13px; padding:16px 0; }
  .segmented{ display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .seg-btn{ flex:1; min-width:70px; padding:8px 6px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); font-size:12.5px; font-weight:700; text-align:center; cursor:pointer;}
  .seg-btn.active{ background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .tag{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; }
  .tag-paid{ background:rgba(111,191,115,.18); color:var(--good); }
  .tag-unpaid{ background:rgba(224,96,63,.18); color:var(--bad); }
  .row-flex{ display:flex; gap:8px; }
  .row-flex > *{ flex:1; }
  .low-stock{ color:var(--bad); font-weight:700; }
  .link-row{ text-align:center; margin-top:4px;}
  .link-row a{ color: var(--info); font-size:13px; text-decoration:none; font-weight:600;}
  .hidden{ display:none !important; }
</style>
</head>

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){
    const existing = JSON.parse(raw);
    if(!existing.settings) existing.settings = {};
    if(existing.settings.scriptUrl===undefined) existing.settings.scriptUrl = "";
    if(existing.settings.syncCursor===undefined) existing.settings.syncCursor = 1;
    if(!existing._applied) existing._applied = {};
    if(!existing._pending) existing._pending = [];
    if(!existing.udhaarPayments) existing.udhaarPayments = [];
    const currentVersion = existing.settings.productSeedVersion || 0;
    if(currentVersion < PRODUCT_SEED_VERSION){
      // Merge fresh default rates/names into existing product list without touching sales/expenses/stock history.
      const defaults = defaultProducts();
      const existingById = {};
      (existing.products||[]).forEach(p=>{ existingById[p.id] = p; });
      const merged = defaults.map(def=>{
        const old = existingById[def.id];
        // Keep any manual price/name edit only if this product already existed before this seed update; otherwise use new default.
        return old ? { ...def, active: old.active } : def;
      });
      // Keep any custom products the owner added manually that aren't part of the default list (but drop known deprecated ones).
      const defaultIds = new Set(defaults.map(d=>d.id));
      const customExtras = (existing.products||[]).filter(p=>!defaultIds.has(p.id) && !DEPRECATED_PRODUCT_IDS.includes(p.id));
      existing.products = [...merged, ...customExtras];
      existing.settings.productSeedVersion = PRODUCT_SEED_VERSION;
      saveDB(existing);
    }
    return existing;
  }
  const seed = {
    products: defaultProducts(),
    sales: [],
    expenses: [],
    workers: [],
    udhaarPayments: [],
    stock: {},
    settings: { cafeName:"Albaik Cafe", lowStockLimit: 10, productSeedVersion: PRODUCT_SEED_VERSION, scriptUrl:"", syncCursor: 1 }
  };
  saveDB(seed);
  return seed;
}
function saveDB(db){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();
if(!db._applied) db._applied = {};
if(!db._pending) db._pending = [];
let currentTab = "sale";

/* ---------------- SYNC ENGINE (Google Apps Script) ---------------- */
function applyEvent(ev){
  if(db._applied[ev.id]) return;
  db._applied[ev.id] = true;
  const payload = ev.payload;
  switch(ev.type){
    case "sale":
      db.sales.push(payload);
      (payload.items||[]).forEach(it=>{
        const p = db.products.find(x=>x.id===it.id);
        if(p && p.track && db.stock[p.id]!=null){
          db.stock[p.id] = Math.max(0, db.stock[p.id] - it.qty);
        }
      });
      break;
    case "expense":
      db.expenses.push(payload);
      break;
    case "worker":
      db.workers.push(payload);
      break;
    case "stock_set":
      db.stock[payload.productId] = payload.qty;
      break;
    case "stock_add":
      db.stock[payload.productId] = (db.stock[payload.productId]||0) + payload.delta;
      break;
    case "product_add":
      db.products.push(payload);
      break;
    case "product_edit_price": {
      const p = db.products.find(x=>x.id===payload.productId);
      if(p) p.price = payload.price;
      break;
    }
    case "product_toggle": {
      const p = db.products.find(x=>x.id===payload.productId);
      if(p) p.active = payload.active;
      break;
    }
    case "sale_delete": {
      const idx = db.sales.findIndex(s=>s.id===payload.saleId);
      if(idx>-1){
        const s = db.sales[idx];
        (s.items||[]).forEach(it=>{
          const p = db.products.find(x=>x.id===it.id);
          if(p && p.track && db.stock[p.id]!=null) db.stock[p.id] = db.stock[p.id] + it.qty;
        });
        db.sales.splice(idx,1);
      }
      break;
    }
    case "expense_delete":
      db.expenses = db.expenses.filter(e=>e.id!==payload.expenseId);
      break;
    case "worker_delete":
      db.workers = db.workers.filter(w=>w.id!==payload.workerId);
      break;
    case "data_reset": {
      if(payload.scope === "all"){
        db.sales = []; db.expenses = []; db.workers = []; db.udhaarPayments = [];
      } else if(payload.scope === "today" && payload.cutoffTs!=null){
        db.sales = db.sales.filter(s=>s.ts < payload.cutoffTs);
        db.expenses = db.expenses.filter(e=>e.ts < payload.cutoffTs);
        db.workers = db.workers.filter(w=>w.ts < payload.cutoffTs);
      }
      break;
    }
    case "udhaar_payment":
      if(!db.udhaarPayments) db.udhaarPayments = [];
      db.udhaarPayments.push(payload);
      break;
    case "settings_update": {
      const { id, ts, syncCursor, scriptUrl, ...rest } = payload;
      Object.assign(db.settings, rest);
      break;
    }
  }
}
function pushEvent(type, payload){
  if(!payload.id) payload.id = uid();
  if(!payload.ts) payload.ts = Date.now();
  const ev = { id: payload.id, type, ts: payload.ts, payload };
  applyEvent(ev);
  saveDB(db);
  sendEvent(ev);
  return payload;
}
function sendEvent(ev){
  const url = db.settings.scriptUrl;
  if(!url) return;
  fetch(url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(ev) })
    .catch(()=>{ db._pending.push(ev); saveDB(db); });
}
function flushPending(){
  const url = db.settings.scriptUrl;
  if(!url || !db._pending.length) return;
  const queue = db._pending.slice();
  db._pending = [];
  saveDB(db);
  queue.forEach(ev=>{
    fetch(url, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(ev) })
      .catch(()=>{ db._pending.push(ev); saveDB(db); });
  });
}
function pullEvents(cb){
  const url = db.settings.scriptUrl;
  if(!url) { if(cb) cb(false); return; }
  const cursor = db.settings.syncCursor || 1;
  fetch(url + (url.indexOf("?")>=0 ? "&" : "?") + "sinceRow=" + cursor)
    .then(r=>r.json())
    .then(data=>{
      let changed = false;
      (data.events||[]).forEach(ev=>{
        if(!db._applied[ev.id]){ applyEvent(ev); changed = true; }
      });
      if(data.lastRow) db.settings.syncCursor = data.lastRow;
      saveDB(db);
      if(changed) render(currentTab);
      if(cb) cb(true);
    })
    .catch(()=>{ if(cb) cb(false); });
}
setInterval(()=>{ pullEvents(); flushPending(); }, 15000);
setTimeout(()=>{ pullEvents(); flushPending(); }, 1500);

function money(n){ return Number(n||0).toLocaleString(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function isSameDay(ts, dateStr){ return todayStr(new Date(ts)) === dateStr; }
function inRange(ts, from, to){ const d = todayStr(new Date(ts)); return d>=from && d<=to; }

function cartTotal(){
  let total=0, count=0;
  for(const pid in cart){
    const p = db.products.find(x=>x.id===pid);
    if(!p) continue;
    total += p.price * cart[pid];
    count += cart[pid];
  }
  return {total, count};
}
function updateBillBar(){
  const {total, count} = cartTotal();
  document.getElementById("billTotal").textContent = money(total);
  document.getElementById("billItemCount").textContent = count;
  document.getElementById("billBar").classList.toggle("hidden", count===0);
}

  const groupQtyTotal = groupItems.reduce((a,p)=>a+(cart[p.id]||0), 0);

    return `

        </div>
      </div>`;
  }

      listHtml += `

          <div class="qty-name">🥤 Small Bottle ${groupQtyTotal>0 ? `<span class="group-badge">${groupQtyTotal} selected</span>` : ""}</div>
          <div class="group-arrow">${smallGroupOpen ? "▲ tap to close" : "▼ tap to open"}</div>

        ${listHtml}
      </div>
    </div>
  `;

  if(toggleEl) toggleEl.addEventListener("click", ()=>{ smallGroupOpen = !smallGroupOpen; renderSale(); });

  app.querySelectorAll("button[data-act]").forEach(btn=>{

      e.stopPropagation();

      const next = Math.max(0, (cart[id]||0) + delta);

        nameEl.innerHTML = `🥤 Small Bottle ${total>0 ? `<span class="group-badge">${total} selected</span>` : ""}`;

function computeTotals(from, to){
  const sales = db.sales.filter(s=>inRange(s.ts, from, to));
  const expenses = db.expenses.filter(e=>inRange(e.ts, from, to));
  const totalSales = sales.reduce((a,s)=>a+s.total,0);
  const totalExpenses = expenses.reduce((a,e)=>a+e.amount,0);
  const byMethod = {};
  sales.forEach(s=>{ byMethod[s.method] = (byMethod[s.method]||0) + s.total; });
  const itemQty = {};
  sales.forEach(s=> s.items.forEach(it=>{ itemQty[it.id] = (itemQty[it.id]||0) + it.qty; }));
  const expByCat = {};
  expenses.forEach(e=>{ expByCat[e.category] = (expByCat[e.category]||0) + e.amount; });
  return { sales, expenses, totalSales, totalExpenses, profit: totalSales-totalExpenses, bills: sales.length, byMethod, itemQty, expByCat };
}

    }
    renderExpenses();
  });
}

/* ================= UDHAAR (CREDIT) ================= */
function normName(n){ return (n||"").trim().toLowerCase(); }
function getUdhaarBalances(){
  const totals = {}; // normName -> { name, owed, paid, items:[...] }
  db.sales.filter(s=>s.method==="Credit/Udhaar" && s.customerName).forEach(s=>{
    const key = normName(s.customerName);
    if(!totals[key]) totals[key] = { name: s.customerName, owed:0, paid:0, sales:[] };
    totals[key].owed += s.total;
    totals[key].sales.push(s);
  });
  (db.udhaarPayments||[]).forEach(p=>{
    const key = normName(p.customerName);
    if(!totals[key]) totals[key] = { name: p.customerName, owed:0, paid:0, sales:[] };
    totals[key].paid += p.amount;
  });
  return Object.values(totals).map(c=>({...c, balance: c.owed - c.paid})).sort((a,b)=>b.balance-a.balance);
}
function renderUdhaar(){
  const customers = getUdhaarBalances().filter(c=>c.balance > 0);
  const totalOutstanding = customers.reduce((a,c)=>a+c.balance,0);
  app.innerHTML = `
    <div class="card">
      <h2>TOTAL OUTSTANDING UDHAAR</h2>
      <div class="stat wide"><div class="label">All Customers Combined</div><div class="value" style="color:var(--bad)">Rs. ${money(totalOutstanding)}</div></div>
    </div>
    <div class="card">
      <h2>CUSTOMERS WITH UDHAAR</h2>
      ${customers.length===0 ? `<div class="empty">No pending Udhaar 🎉</div>` :
        customers.map(c=>`
          <div class="list-item" data-customer="${encodeURIComponent(c.name)}" style="cursor:pointer;">
            <span>👤 ${c.name}</span>
            <span style="font-weight:800; color:var(--bad)">Rs. ${money(c.balance)}</span>
          </div>
        `).join("")
      }
    </div>
  `;
  app.querySelectorAll("[data-customer]").forEach(row=>{
    row.addEventListener("click", ()=> renderUdhaarDetail(decodeURIComponent(row.dataset.customer)));
  });
}
function renderUdhaarDetail(name){
  const key = normName(name);
  const all = getUdhaarBalances();
  const cust = all.find(c=>normName(c.name)===key);
  if(!cust){ renderUdhaar(); return; }
  const products = db.products;
  const sortedSales = cust.sales.slice().sort((a,b)=>b.ts-a.ts);
  app.innerHTML = `
    <div class="card">
      <h2>👤 ${cust.name}</h2>
      <div class="stat wide" style="margin-bottom:10px;">
        <div class="label">Current Balance</div>
        <div class="value" style="color:${cust.balance>0?'var(--bad)':'var(--good)'}">Rs. ${money(cust.balance)}</div>
      </div>
      ${cust.balance>0 ? `<button class="btn btn-good btn-full" id="settleBtn">✅ Mark as Paid (Rs. ${money(cust.balance)})</button>` : `<div class="empty">Fully settled</div>`}
      <div style="height:8px;"></div>
      <button class="btn btn-outline btn-full" id="backToUdhaar">← Back to list</button>
    </div>
    <div class="card">
      <h2>PURCHASE HISTORY (Udhaar visits)</h2>
      ${sortedSales.map(s=>{
        const dt = new Date(s.ts);
        const lines = s.items.map(it=>{
          const p = products.find(x=>x.id===it.id);
          return `${p?p.name:it.id} × ${it.qty}`;
        }).join(", ");
        return `<div class="list-item" style="display:block;">
          <div style="display:flex; justify-content:space-between;"><span class="sub">${dt.toLocaleDateString()} ${dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><span style="font-weight:800;">Rs. ${money(s.total)}</span></div>
          <div class="sub" style="margin-top:3px;">${lines}</div>
        </div>`;
      }).join("")}
    </div>
  `;
  document.getElementById("backToUdhaar").addEventListener("click", renderUdhaar);
  const settleBtn = document.getElementById("settleBtn");
  if(settleBtn) settleBtn.addEventListener("click", ()=>{
    if(!confirm(`Mark Rs. ${money(cust.balance)} as fully paid by ${cust.name}?`)) return;
    pushEvent("udhaar_payment", { customerName: cust.name, amount: cust.balance });
    renderUdhaar();
  });
}

/* ================= REPORTS ================= */
function renderReports(range){
  const t = todayStr();
  range = range || "today";
  let from=t, to=t;
  const now = new Date();
  if(range==="yesterday"){ const y=new Date(now); y.setDate(y.getDate()-1); from=to=todayStr(y); }
  if(range==="week"){ const w=new Date(now); w.setDate(w.getDate()-6); from=todayStr(w); to=t; }
  if(range==="month"){ from = t.slice(0,8)+"01"; to=t; }
  const customFrom = document.getElementById("repFrom")?.value;
  const customTo = document.getElementById("repTo")?.value;
  if(range==="custom" && customFrom && customTo){ from=customFrom; to=customTo; }

  const d = computeTotals(from, to);
  const laborInRange = db.workers.filter(w=>w.paid && w.date && inRange(new Date(w.date+"T00:00").getTime(), from, to)).reduce((a,w)=>a+Number(w.amount||0),0);
  const products = db.products;

  app.innerHTML = `
    <div class="card">
      <h2>REPORT RANGE</h2>
      <div class="segmented">
        <div class="seg-btn ${range==='today'?'active':''}" data-r="today">Today</div>
        <div class="seg-btn ${range==='yesterday'?'active':''}" data-r="yesterday">Yesterday</div>
        <div class="seg-btn ${range==='week'?'active':''}" data-r="week">This Week</div>
        <div class="seg-btn ${range==='month'?'active':''}" data-r="month">This Month</div>
        <div class="seg-btn ${range==='custom'?'active':''}" data-r="custom">Custom</div>
      </div>
      <div class="row-flex ${range==='custom'?'':'hidden'}" id="customRange">
        <div class="field"><label>From</label><input type="date" id="repFrom" value="${customFrom||from}"></div>
        <div class="field"><label>To</label><input type="date" id="repTo" value="${customTo||to}"></div>
      </div>
      <button class="btn btn-outline btn-full ${range==='custom'?'':'hidden'}" id="applyCustom">Apply</button>
    </div>

    <div class="card">
      <h2>${from} to ${to}</h2>
      <div class="stat-grid">
        <div class="stat"><div class="label">Total Sales</div><div class="value">Rs. ${money(d.totalSales)}</div></div>
        <div class="stat"><div class="label">Total Expenses</div><div class="value">Rs. ${money(d.totalExpenses+laborInRange)}</div></div>
        <div class="stat"><div class="label">Total Profit</div><div class="value" style="color:${(d.totalSales-d.totalExpenses-laborInRange)>=0?'var(--good)':'var(--bad)'}">Rs. ${money(d.totalSales-d.totalExpenses-laborInRange)}</div></div>
        <div class="stat"><div class="label">Total Bills</div><div class="value">${d.bills}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>PRODUCT QUANTITY REPORT</h2>
      ${Object.keys(d.itemQty).length===0 ? `<div class="empty">No sales in this range</div>` :
        Object.keys(d.itemQty).map(id=>{
          const p = products.find(x=>x.id===id);
          return `<div class="list-item"><span>${p?p.name:id}</span><span>${d.itemQty[id]}</span></div>`;
        }).join("")
      }
    </div>

    <div class="card">
      <h2>EXPENSE REPORT</h2>
      ${Object.keys(d.expByCat).length===0 && laborInRange===0 ? `<div class="empty">No expenses in this range</div>` : `
      ${Object.keys(d.expByCat).map(c=>`<div class="list-item"><span>${c}</span><span>Rs. ${money(d.expByCat[c])}</span></div>`).join("")}
      <div class="list-item"><span>Labor Expenses</span><span>Rs. ${money(laborInRange)}</span></div>
      `}
    </div>
  `;

  app.querySelectorAll(".seg-btn[data-r]").forEach(b=>{
    b.addEventListener("click", ()=> renderReports(b.dataset.r));
  });
  const applyBtn = document.getElementById("applyCustom");
  if(applyBtn) applyBtn.addEventListener("click", ()=> renderReports("custom"));
}

    </div>
  `;
  document.getElementById("addProductBtn").addEventListener("click", ()=>{
    const name = document.getElementById("pName").value.trim();

    pushEvent("product_add", {

      cost: Number(document.getElementById("pCost").value||0),
      active:true, track: document.getElementById("pTrack").checked
    });
    renderProducts();
  });
  app.querySelectorAll("[data-toggle]").forEach(btn=>{

      const p = db.products.find(x=>x.id===btn.dataset.toggle);
      pushEvent("product_toggle", { productId: p.id, active: !p.active });
      renderProducts();
    });
  });
  app.querySelectorAll("[data-editprice]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const p = db.products.find(x=>x.id===btn.dataset.editprice);
      const val = prompt("New price for "+p.name, p.price);
      if(val!==null && !isNaN(val) && Number(val)>0){
        pushEvent("product_edit_price", { productId: p.id, price: Number(val) });
        renderProducts();
      }
    });
  });
  document.getElementById("saveCafeName").addEventListener("click", ()=>{
    const name = document.getElementById("cafeNameInput").value.trim() || "Albaik Cafe";
    pushEvent("settings_update", { cafeName: name });
    alert("Saved");
  });
  document.getElementById("saveScriptUrl").addEventListener("click", ()=>{
    db.settings.scriptUrl = document.getElementById("scriptUrlInput").value.trim();
    db.settings.syncCursor = 1;
    saveDB(db);
    alert(db.settings.scriptUrl ? "Sync URL saved. Tap 'Sync Now' to fetch existing data." : "Sync URL cleared — this phone will work offline.");
    renderProducts();
  });
  document.getElementById("syncNowBtn").addEventListener("click", ()=>{
    pullEvents((ok)=>{ flushPending(); alert(ok ? "Synced!" : "Could not reach the sync server. Check the URL and internet connection."); });
  });
  document.getElementById("resetTodayBtn").addEventListener("click", ()=>{
    if(!confirm("Delete ALL of today's sales and expenses on every synced phone? This cannot be undone.")) return;
    const start = new Date(); start.setHours(0,0,0,0);
    pushEvent("data_reset", { scope:"today", cutoffTs: start.getTime() });
    alert("Today's records have been cleared.");
    renderProducts();
  });
  document.getElementById("resetAllBtn").addEventListener("click", ()=>{
    if(!confirm("This will permanently delete ALL sales, expenses, worker payments and Udhaar history on every synced phone. Products and prices are kept. Continue?")) return;
    if(!confirm("Are you absolutely sure? This cannot be undone.")) return;
    pushEvent("data_reset", { scope:"all" });
    alert("All records have been cleared.");
    renderProducts();
  });
}
